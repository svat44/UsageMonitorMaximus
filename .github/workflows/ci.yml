name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (keyring / secret service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test -p usage-core -p usage-monitor-statusline

  # Windows-specific validation. Linux results prove nothing about these.
  windows-native:
    name: Windows native validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Credential Manager conformance (real Windows Credential Manager)
        run: cargo test -p usage-core --lib -- --ignored keyring --nocapture
      - run: npm ci
      - run: npm run build
      - run: cargo build -p usage-monitor-app -p usage-monitor-statusline --features usage-monitor-app/custom-protocol
      - name: Window / tray / autostart / quit smoke test
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Bin target\debug\usage-monitor-app.exe

  macos-keychain:
    name: macOS Keychain validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p usage-core --lib -- --ignored keyring --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: npm ci
      - name: Generated TypeScript types are up to date with the Rust types
        run: |
          cargo test -p usage-core --lib export_bindings
          git diff --exit-code -- src/types/generated
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "true" }

  tauri-linux:
    name: Tauri build + native smoke (Linux, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libssl-dev libdbus-1-dev pkg-config xvfb dbus-x11 python3
      - run: npm ci && npm run build
      - run: cargo test -p usage-monitor-app
      - run: cargo build -p usage-monitor-app -p usage-monitor-statusline --features usage-monitor-app/custom-protocol
      - run: ./scripts/smoke-linux.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p usage-core -p usage-monitor-statusline --all-targets -- -D warnings

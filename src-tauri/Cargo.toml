[package]
name = "usage-monitor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Usage Monitor Maximus desktop shell (Tauri 2)"

[lib]
name = "usage_monitor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "usage-monitor-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
usage-core = { path = "../crates/usage-core" }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
ts-rs = { version = "12", features = ["chrono-impl"] }

[features]
# Needed by `cargo tauri dev/build`; kept here so plain `cargo build` also works.
custom-protocol = ["tauri/custom-protocol"]

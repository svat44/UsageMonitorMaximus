[package]
name = "usage-monitor-statusline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Claude Code statusLine command: stores the session JSON for the desktop app. No network, no credentials."

[[bin]]
name = "usage-monitor-statusline"
path = "src/main.rs"

[dependencies]
usage-core = { path = "../usage-core", default-features = false }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
